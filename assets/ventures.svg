<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t d">
<title id="t">Companies and channels led by Masroor Shahani</title>
<desc id="d">NEXORA LLC software agency, The Ray Perfumes fragrance brand, Dhanda Dimaag business reels and Masroor Digital Desk data tutorials.</desc>
<defs>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#102A6B"/><stop offset="1" stop-color="#0A1A3F"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60A5FA" stop-opacity="0"/><stop offset=".5" stop-color="#BFDBFE"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="276" height="210" rx="14"/></clipPath>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.tile{opacity:0;transform:translateY(16px);animation:in .8s cubic-bezier(.2,.7,.2,1) forwards}
.t1{animation-delay:.1s}.t2{animation-delay:.35s}.t3{animation-delay:.6s}.t4{animation-delay:.85s}
@keyframes in{to{opacity:1;transform:translateY(0)}}
.beam{animation:beam 5s ease-in-out infinite}
.b2{animation-delay:1.25s}.b3{animation-delay:2.5s}.b4{animation-delay:3.75s}
@keyframes beam{0%{transform:translateX(-200px)}40%,100%{transform:translateX(320px)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.tile,.beam,.ping{animation:none!important}.tile{opacity:1;transform:none}.ping{display:none}}
</style>
</defs>

<g transform="translate(12,20)"><g class="tile t1">
<rect width="276" height="210" rx="14" fill="url(#card)" stroke="#3B82F6" stroke-opacity=".5"/>
<g clip-path="url(#c)"><rect class="beam" x="0" y="0" width="160" height="3" fill="url(#beam)"/></g>
<g transform="translate(24,26)"><rect width="14" height="44" fill="#3B82F6"/><rect x="30" width="14" height="44" fill="#1D4ED8"/><polygon points="0,0 14,0 44,44 30,44" fill="#93C5FD"/></g>
<text x="24" y="104" font-size="22" font-weight="800" fill="#FFFFFF">NEXORA LLC</text>
<text x="24" y="130" font-size="14" fill="#93C5FD">Founder &amp; CEO</text>
<text x="24" y="160" font-size="14" fill="#DBEAFE">Software and digital agency:</text>
<text x="24" y="180" font-size="14" fill="#DBEAFE">websites, apps, automation</text>
<circle cx="250" cy="34" r="5" fill="#60A5FA"/><circle class="ping" cx="250" cy="34" r="5" fill="#60A5FA"/>
</g></g>

<g transform="translate(308,20)"><g class="tile t2">
<rect width="276" height="210" rx="14" fill="url(#card)" stroke="#3B82F6" stroke-opacity=".5"/>
<g clip-path="url(#c)"><rect class="beam b2" x="0" y="0" width="160" height="3" fill="url(#beam)"/></g>
<g transform="translate(24,22)" fill="none" stroke="#93C5FD" stroke-width="2.5" stroke-linejoin="round">
<rect x="12" y="0" width="14" height="10" rx="2"/><path d="M4 16 H34 L38 48 H0 Z"/><path d="M10 30 H28" stroke-opacity=".6"/>
</g>
<text x="24" y="104" font-size="22" font-weight="800" fill="#FFFFFF">The Ray Perfumes</text>
<text x="24" y="130" font-size="14" fill="#93C5FD">Founder &amp; CEO</text>
<text x="24" y="160" font-size="14" fill="#DBEAFE">Luxury fragrance brand with</text>
<text x="24" y="180" font-size="14" fill="#DBEAFE">its own online store</text>
</g></g>

<g transform="translate(604,20)"><g class="tile t3">
<rect width="276" height="210" rx="14" fill="url(#card)" stroke="#3B82F6" stroke-opacity=".5"/>
<g clip-path="url(#c)"><rect class="beam b3" x="0" y="0" width="160" height="3" fill="url(#beam)"/></g>
<g transform="translate(24,24)"><rect width="30" height="46" rx="6" fill="none" stroke="#93C5FD" stroke-width="2.5"/><polygon points="11,15 22,23 11,31" fill="#60A5FA"/></g>
<text x="24" y="104" font-size="22" font-weight="800" fill="#FFFFFF">Dhanda Dimaag</text>
<text x="24" y="130" font-size="14" fill="#93C5FD">Creator</text>
<text x="24" y="160" font-size="14" fill="#DBEAFE">Short business and money</text>
<text x="24" y="180" font-size="14" fill="#DBEAFE">story reels</text>
</g></g>

<g transform="translate(900,20)"><g class="tile t4">
<rect width="276" height="210" rx="14" fill="url(#card)" stroke="#3B82F6" stroke-opacity=".5"/>
<g clip-path="url(#c)"><rect class="beam b4" x="0" y="0" width="160" height="3" fill="url(#beam)"/></g>
<g transform="translate(24,24)"><rect y="30" width="9" height="16" fill="#1D4ED8"/><rect x="14" y="18" width="9" height="28" fill="#3B82F6"/><rect x="28" y="4" width="9" height="42" fill="#93C5FD"/></g>
<text x="24" y="104" font-size="22" font-weight="800" fill="#FFFFFF">Masroor Digital Desk</text>
<text x="24" y="130" font-size="14" fill="#93C5FD">YouTube Channel</text>
<text x="24" y="160" font-size="14" fill="#DBEAFE">Data, AI and automation</text>
<text x="24" y="180" font-size="14" fill="#DBEAFE">tutorials, start to finish</text>
</g></g>
</svg>
