<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="16" viewBox="0 0 1200 16" role="img" aria-label="Section divider">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563EB" stop-opacity="0"/><stop offset=".5" stop-color="#2563EB" stop-opacity=".7"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></linearGradient>
<linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#93C5FD" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#93C5FD" stop-opacity="0"/></linearGradient>
<style>.run{animation:run 4s ease-in-out infinite}@keyframes run{from{transform:translateX(-200px)}to{transform:translateX(1200px)}}@media (prefers-reduced-motion:reduce){.run{display:none}}</style>
